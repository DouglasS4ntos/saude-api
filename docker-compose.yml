version: '3.8'

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=lacrei_db
      - POSTGRES_USER=lacrei_user
      - POSTGRES_PASSWORD=lacrei_pass
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DB_NAME=lacrei_db
      - DB_USER=lacrei_user
      - DB_PASS=lacrei_pass
      - DB_HOST=db
    depends_on:
      - db

volumes:
  postgres_data:
